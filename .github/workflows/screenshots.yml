# Compile l'app pour le simulateur, lance les tests de SofiaCore, puis prend les captures d'écran
# de l'App Store (iPhone 6,3" et iPad 13") avec .github/scripts/screenshots.sh.
# Les captures sont dans l'artefact « app-store-screenshots » de l'exécution, et publiées sur la
# branche « screenshots » (remplacée à chaque exécution réussie).
name: App Store screenshots

on:
  workflow_dispatch:
  push:
    branches: ['claude/**']

concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: SofiaCore tests
        run: swift test --package-path SofiaCore

  screenshots:
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Build for the simulator
        run: |
          xcodebuild -version
          xcodebuild -project Sofia.xcodeproj -scheme Sofia -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO -quiet build
      - name: Take screenshots
        run: .github/scripts/screenshots.sh build/Build/Products/Debug-iphonesimulator/Sofia.app screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-store-screenshots
          path: screenshots
          if-no-files-found: warn
      - name: Publish to the screenshots branch
        run: |
          publish="$RUNNER_TEMP/publish"
          mkdir -p "$publish"
          cp -R screenshots/. "$publish/"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan screenshots-publish
          git rm -rfq .
          cp -R "$publish/." .
          git add iphone ipad
          git commit -q -m "App Store screenshots of ${GITHUB_SHA::7}"
          git push -f origin HEAD:refs/heads/screenshots
